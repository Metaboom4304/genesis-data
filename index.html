<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>GENESIS WAR MAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      height: 100%;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #fff;
    }
    
    #login-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      text-align: center;
      padding: 20px;
    }
    
    #login-container h1 {
      margin-bottom: 20px;
      font-size: 2.2rem;
      color: #4dabf7;
    }
    
    #login-button {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #1971c2, #1c7ed6);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(25, 113, 194, 0.4);
    }
    
    #login-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(25, 113, 194, 0.6);
    }
    
    #login-button:active {
      transform: translateY(1px);
    }
    
    #panel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(20, 20, 30, 0.9);
      color: #fff;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px;
      gap: 15px;
      z-index: 900;
      backdrop-filter: blur(5px);
      border-bottom: 1px solid #2c3e50;
    }
    
    #map-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: #74c0fc;
      margin-right: 20px;
    }
    
    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(40, 40, 50, 0.8);
      border-radius: 6px;
      padding: 5px;
    }
    
    #search {
      width: 150px;
      padding: 8px 30px 8px 12px;
      background: transparent;
      border: 1px solid #495057;
      border-radius: 4px;
      color: #e9ecef;
      font-size: 1rem;
    }
    
    #search:focus {
      outline: none;
      border-color: #4dabf7;
      box-shadow: 0 0 0 3px rgba(77, 171, 247, 0.3);
    }
    
    #search-clear {
      position: absolute;
      right: 10px;
      cursor: pointer;
      color: #adb5bd;
      font-size: 20px;
      transition: color 0.2s;
    }
    
    #search-clear:hover {
      color: #ff6b6b;
    }
    
    #goto-btn, #reset, #screenshot-btn {
      padding: 8px 15px;
      background: #3b5bdb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    
    #goto-btn:hover, #reset:hover, #screenshot-btn:hover {
      background: #364fc7;
    }
    
    #status-filter {
      padding: 8px;
      background: #343a40;
      color: #e9ecef;
      border: 1px solid #495057;
      border-radius: 4px;
      min-width: 150px;
    }
    
    #favorites-container {
      background: rgba(30, 30, 40, 0.8);
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      flex: 1 0 100%;
    }
    
    #favorites-container h4 {
      margin-bottom: 10px;
      color: #ffd43b;
    }
    
    #favorites-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
    }
    
    #favorites-list li {
      padding: 8px;
      background: rgba(50, 50, 60, 0.6);
      margin-bottom: 6px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    #favorites-list button {
      padding: 4px 8px;
      background: #495057;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-left: 5px;
    }
    
    #favorites-list button:hover {
      background: #5c636a;
    }
    
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 500;
    }
    
    #toggle-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 910;
      background: #343a40;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      cursor: pointer;
    }
    
    #layer-select-small {
      position: absolute;
      top: 50px;
      right: 10px;
      z-index: 910;
      background: #343a40;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px;
    }
    
    #debug {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 20, 10, 0.85);
      color: #20c997;
      font-size: 12px;
      padding: 12px;
      z-index: 9999;
      max-height: 40vh;
      overflow: auto;
      font-family: 'Courier New', monospace;
      border-top: 1px solid #20c997;
    }
    
    .debug-section {
      margin-bottom: 10px;
    }
    
    #debug-log {
      max-height: 120px;
      overflow: auto;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #20c997;
    }
    
    .tile-label {
      background: rgba(0, 0, 0, 0.7);
      padding: 3px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 1px black;
    }
    
    .loader {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    
    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top: 5px solid #4dabf7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    
    .loader-text {
      margin-top: 15px;
      text-align: center;
      font-size: 1.1rem;
      color: white;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .collapsed {
      max-height: 50px !important;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="login-container">
    <h1>Добро пожаловать в GENESIS WAR MAP</h1>
    <button id="login-button">🔐 Войти через Telegram</button>
  </div>

  <div id="panel">
    <strong id="map-title">🧭 GENESIS WAR MAP</strong>
    
    <div class="search-wrapper">
      <input type="text" id="search" placeholder="Тайл-ID" />
      <span id="search-clear">×</span>
      <button id="goto-btn">➡️ Перейти</button>
    </div>
    
    <label>
      🎯 Метка:
      <select id="status-filter">
        <option value="">— Все —</option>
        <option value="ally">🟩 Союзник</option>
        <option value="enemy">🟥 Враг</option>
        <option value="favorite">⭐️ Избранное</option>
        <option value="clear">⚪️ Без метки</option>
      </select>
    </label>
    
    <button id="reset">♻️ Сбросить</button>
    <button id="screenshot-btn">📸 Снимок</button>
    
    <div id="favorites-container">
      <h4>⭐ Избранное</h4>
      <ul id="favorites-list"></ul>
    </div>
  </div>

  <div id="map"></div>
  
  <button id="toggle-panel">🔽</button>
  <select id="layer-select-small">
    <option value="neutral">N</option>
    <option value="world">W</option>
    <option value="satellite">S</option>
  </select>
  
  <div class="loader" id="loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Загрузка данных...</div>
  </div>

  <div id="debug">
    <div class="debug-section" id="tg-status">Telegram WebApp: ⏳</div>
    <div class="debug-section" id="user-status">Пользователь: ⏳</div>
    <div class="debug-section" id="map-status">Карта: ⏳</div>
    <div class="debug-section" id="api-status">API: ⏳</div>
    <div class="debug-section" id="cache-status">Кеш: ⏳</div>
    <div class="debug-section" id="error-log">Ошибки: ⏳</div>
    <div id="debug-log"></div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script>
    // Конфигурация
    const API_URL = 'https://genesis-map-api.onrender.com'; // ЗАМЕНИТЕ на ваш реальный URL сервера
    const degLat = 170/256, degLng = 360/256;
    const CACHE_TTL = 30 * 60 * 1000; // 30 минут

    // Глобальные переменные
    let map, gridLayer, tileLayer;
    let tileData = [];
    let tileMarkers = {};
    let currentUser = null;
    let userMarks = {};
    let favorites = [];

    // Элементы UI
    const loader = document.getElementById('loader');
    const debugLog = document.getElementById('debug-log');

    // Логирование в отладочную панель
    function log(message, isError) {
      const now = new Date();
      const timestamp = '[' + now.toLocaleTimeString() + ']';
      const logEntry = document.createElement('div');
      
      logEntry.textContent = timestamp + ' ' + message;
      if (isError) {
        logEntry.style.color = '#ff6b6b';
      }
      
      debugLog.appendChild(logEntry);
      debugLog.scrollTop = debugLog.scrollHeight;
      
      if (isError) {
        console.error(message);
        document.getElementById('error-log').textContent = 'Ошибки: 🔴 ' + message.substring(0, 50) + '...';
      } else {
        console.log(message);
      }
    }

    // Показать/скрыть лоадер
    function showLoader(visible) {
      loader.style.display = visible ? 'block' : 'none';
    }

    // Проверка Telegram WebApp
    function initTelegram() {
      const tg = window.Telegram ? window.Telegram.WebApp : null;
      
      if (tg) {
        tg.ready();
        log('🤖 Telegram WebApp готов');
        document.getElementById('tg-status').textContent = 'Telegram WebApp: ✅';
        
        return tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
      }
      
      log('Telegram WebApp не обнаружен, работаем в автономном режиме');
      document.getElementById('tg-status').textContent = 'Telegram WebApp: ⚠️ Не обнаружен';
      return null;
    }

    // Инициализация карты
    function initMap(user) {
      try {
        currentUser = user || { id: 'test-user', first_name: 'Тестовый пользователь' };
        document.getElementById('login-container').style.display = 'none';
        document.body.classList.add('logged-in');
        
        log('👤 Пользователь: ' + currentUser.first_name + ' (' + currentUser.id + ')');
        document.getElementById('user-status').textContent = 'Пользователь: ✅ ' + currentUser.first_name;
        
        // Создаем карту
        map = L.map('map', {
          center: [49.25, -123.10],
          zoom: 6,
          minZoom: 3,
          maxZoom: 10,
          attributionControl: false,
          zoomControl: false
        });
        
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        log('🗺️ Карта создана');
        document.getElementById('map-status').textContent = 'Карта: ✅ Инициализирована';
        
        // Базовые слои
        const layers = {
          neutral: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'),
          world: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png'),
          satellite: L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            { attribution: 'Esri' }
          )
        };
        
        layers.neutral.addTo(map);
        
        document.getElementById('layer-select-small').addEventListener('change', function(e) {
          Object.values(layers).forEach(function(l) { map.removeLayer(l); });
          layers[e.target.value].addTo(map);
        });
        
        // Группы слоев
        gridLayer = L.layerGroup().addTo(map);
        tileLayer = L.layerGroup().addTo(map);
        
        // Загрузка данных
        loadData();
        
        // Инициализация событий
        initEventListeners();
        
      } catch (error) {
        log('⚠️ Ошибка инициализации карты: ' + error.message, true);
        alert('Критическая ошибка при инициализации карты');
      }
    }

    // Загрузка данных
    async function loadData() {
      showLoader(true);
      log('🔄 Загрузка данных...');
      
      try {
        // Загрузка пользовательских данных
        const userResponse = await fetch(API_URL + '/api/marks/' + currentUser.id);
        if (!userResponse.ok) throw new Error('Ошибка загрузки меток');
        
        const marks = await userResponse.json();
        userMarks = {};
        marks.forEach(function(mark) {
          if (!userMarks[mark.tile_id]) userMarks[mark.tile_id] = {};
          userMarks[mark.tile_id][mark.mark_type] = mark.comment || true;
          
          if (mark.mark_type === 'favorite') {
            favorites.push(mark.tile_id);
          }
        });
        
        log('📌 Загружено ' + marks.length + ' пользовательских меток');
        
        // Загрузка кеша тайлов
        const cacheResponse = await fetch(API_URL + '/api/tiles-cache');
        if (!cacheResponse.ok) throw new Error('Ошибка загрузки кеша');
        
        const cache = await cacheResponse.json();
        if (cache && cache.data) {
          const cacheAge = Date.now() - new Date(cache.last_updated).getTime();
          if (cacheAge < CACHE_TTL) {
            tileData = Object.values(cache.data);
            log('✅ Использован кеш тайлов (' + tileData.length + ' записей)');
            document.getElementById('cache-status').textContent = 'Кеш: ✅ Актуальный';
          }
        }
        
        // Если кеш устарел или отсутствует
        if (!tileData.length) {
          log('⏬ Загрузка данных с основного сервера...');
          const tileResponse = await fetch(API_URL + '/api/proxy/tile-info');
          if (!tileResponse.ok) throw new Error('Ошибка загрузки тайлов');
          
          const tiles = await tileResponse.json();
          tileData = Object.values(tiles);
          
          // Сохраняем в кеш
          await fetch(API_URL + '/api/tiles-cache', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: tiles })
          });
          
          log('💾 Сохранен новый кеш (' + tileData.length + ' тайлов)');
          document.getElementById('cache-status').textContent = 'Кеш: ✅ Обновлен';
        }
        
        // Инициализация координат
        initTileCoordinates();
        
        // Первичная отрисовка
        drawGrid();
        drawTiles();
        renderFavorites();
        
        document.getElementById('api-status').textContent = 'API: ✅ Работает';
        log('✅ Все данные успешно загружены');
        
      } catch (error) {
        log('⚠️ Ошибка загрузки данных: ' + error.message, true);
        document.getElementById('api-status').textContent = 'API: 🔴 Ошибка';
        
        // Запасной вариант - создаем базовые данные
        createFallbackData();
      } finally {
        showLoader(false);
      }
    }

    // Создание запасных данных при недоступности API
    function createFallbackData() {
      log('🔄 Создание базовых данных...');
      
      // Создаем базовые тайлы
      const refId = 22313, refLat = 49.25, refLng = -123.10;
      const refX = refId % 256, refY = Math.floor(refId / 256);
      
      for (let i = 0; i < 1000; i++) {
        const x = i % 256;
        const y = Math.floor(i / 256);
        const lat = refLat - (y - refY) * degLat;
        const lng = refLng + (x - refX) * degLng;
        
        tileData.push({
          id_tile: i,
          lat: lat,
          lng: lng,
          has_owner: Math.random() > 0.7 ? 'true' : 'false'
        });
      }
      
      log('✅ Создано ' + tileData.length + ' базовых тайлов');
      drawGrid();
      drawTiles();
    }

    // Инициализация координат тайлов
    function initTileCoordinates() {
      const refId = 22313, refLat = 49.25, refLng = -123.10;
      const refX = refId % 256, refY = Math.floor(refId / 256);
      
      tileData.forEach(function(t) {
        const x = t.id_tile % 256;
        const y = Math.floor(t.id_tile / 256);
        t.lat = refLat - (y - refY) * degLat;
        t.lng = refLng + (x - refX) * degLng;
      });
    }

    // Отрисовка сетки
    function drawGrid() {
      gridLayer.clearLayers();
      const bounds = map.getBounds();
      
      tileData.forEach(function(t) {
        if (!bounds.contains([t.lat, t.lng])) return;
        
        const tileBounds = L.latLngBounds(
          [t.lat - degLat/2, t.lng - degLng/2],
          [t.lat + degLat/2, t.lng + degLng/2]
        );
        
        L.rectangle(tileBounds, {
          stroke: true,
          weight: 0.6,
          color: '#555',
          fill: false
        }).addTo(gridLayer);
      });
    }

    // Отрисовка тайлов
    function drawTiles() {
      tileLayer.clearLayers();
      Object.values(tileMarkers).forEach(function(marker) { tileLayer.removeLayer(marker); });
      tileMarkers = {};
      
      const filter = document.getElementById('status-filter').value;
      const searchValue = document.getElementById('search').value.trim();
      const bounds = map.getBounds();
      
      tileData.forEach(function(t) {
        // Фильтрация
        const tileMarks = userMarks[t.id_tile] || {};
        const status = 
          tileMarks.ally ? 'ally' :
          tileMarks.enemy ? 'enemy' :
          tileMarks.favorite ? 'favorite' : '';
        
        if (filter === 'ally' && !tileMarks.ally) return;
        if (filter === 'enemy' && !tileMarks.enemy) return;
        if (filter === 'favorite' && !tileMarks.favorite) return;
        if (filter === 'clear' && status) return;
        if (searchValue && String(t.id_tile) !== searchValue) return;
        if (!bounds.contains([t.lat, t.lng])) return;
        
        // Создание маркера
        tileMarkers[t.id_tile] = createTileMarker(t, tileMarks);
        tileLayer.addLayer(tileMarkers[t.id_tile]);
      });
    }

    // Создание маркера для тайла
    function createTileMarker(t, marks) {
      const tileBounds = L.latLngBounds(
        [t.lat - degLat/2, t.lng - degLng/2],
        [t.lat + degLat/2, t.lng + degLng/2]
      );
      
      const status = 
        marks.ally ? 'ally' :
        marks.enemy ? 'enemy' :
        marks.favorite ? 'favorite' : '';
      
      const isFav = favorites.includes(t.id_tile);
      const comment = marks.comment || '';
      const owned = t.has_owner === 'true';
      
      // Стилизация
      const fill = status === 'ally' ? '#40c057' :
                  status === 'enemy' ? '#fa5252' :
                  status === 'favorite' ? '#fab005' :
                  owned ? '#4dabf7' : '#495057';
                  
      const stroke = status === 'ally' ? '#2f9e44' :
                    status === 'enemy' ? '#e03131' :
                    status === 'favorite' ? '#f59f00' : '#343a40';
      
      const rect = L.rectangle(tileBounds, {
        stroke: true,
        weight: 1.5,
        color: stroke,
        dashArray: status ? '5' : null,
        fillColor: fill,
        fillOpacity: 0.4
      });
      
      // Добавление подписи
      if (map.getZoom() >= 5) {
        rect.bindTooltip('#' + t.id_tile, {
          permanent: true,
          direction: 'center',
          className: 'tile-label'
        });
      }
      
      // Всплывающее окно
      const popupContent = `
        <div style="min-width: 250px">
          <h3 style="margin-bottom: 12px; color: #4dabf7;">Тайл #${t.id_tile}</h3>
          <p><strong>Статус:</strong> ${owned ? 'Занят' : 'Свободен'}</p>
          <p><strong>Метка:</strong> ${status || '—'}</p>
          <p><strong>Комментарий:</strong> ${comment || '—'}</p>
          
          <div style="margin: 15px 0; display: flex; gap: 5px; flex-wrap: wrap;">
            <button class="mark-btn" data-id="${t.id_tile}" data-type="ally">🟩 Союзник</button>
            <button class="mark-btn" data-id="${t.id_tile}" data-type="enemy">🟥 Враг</button>
            <button class="mark-btn" data-id="${t.id_tile}" data-type="favorite">⭐ Избранное</button>
            <button class="mark-btn" data-id="${t.id_tile}" data-type="clear">⚪ Сброс</button>
          </div>
          
          <textarea id="comment-${t.id_tile}" placeholder="Ваш комментарий..." 
            style="width: 100%; min-height: 80px; padding: 8px; margin-bottom: 10px;">${comment}</textarea>
          
          <button class="save-comment" data-id="${t.id_tile}">💾 Сохранить комментарий</button>
        </div>
      `;
      
      rect.bindPopup(popupContent);
      return rect;
    }

    // Отрисовка избранного
    function renderFavorites() {
      const favList = document.getElementById('favorites-list');
      if (!favList) return;
      
      favList.innerHTML = favorites.map(function(id) {
        const tile = tileData.find(function(t) { return t.id_tile === id; });
        return `
          <li data-id="${id}">
            Тайл #${id}
            <div>
              <button class="goto-fav" data-id="${id}">➡️</button>
              <button class="remove-fav" data-id="${id}">✕</button>
            </div>
          </li>
        `;
      }).join('');
    }

    // Сохранение метки
    async function saveMark(tileId, markType, comment) {
      try {
        const response = await fetch(API_URL + '/api/marks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: currentUser.id,
            tile_id: tileId,
            mark_type: markType,
            comment: comment || null
          })
        });
        
        if (!response.ok) throw new Error('Ошибка сохранения');
        
        const result = await response.json();
        log('💾 Метка сохранена: ' + tileId + ' (' + markType + ')');
        
        // Обновление локального состояния
        if (!userMarks[tileId]) userMarks[tileId] = {};
        
        if (markType === 'clear') {
          delete userMarks[tileId];
          favorites = favorites.filter(function(favId) { return favId !== tileId; });
        } else {
          userMarks[tileId][markType] = comment || true;
          if (markType === 'favorite' && !favorites.includes(tileId)) {
            favorites.push(tileId);
          }
        }
        
        // Обновление UI
        updateTile(tileId);
        renderFavorites();
        
        return result;
      } catch (error) {
        log('⚠️ Ошибка сохранения метки: ' + error.message, true);
      }
    }

    // Обновление тайла
    function updateTile(id) {
      if (tileMarkers[id]) {
        tileLayer.removeLayer(tileMarkers[id]);
        const tile = tileData.find(function(t) { return t.id_tile === id; });
        if (tile) {
          tileMarkers[id] = createTileMarker(tile, userMarks[id] || {});
          tileLayer.addLayer(tileMarkers[id]);
        }
      }
    }

    // Инициализация обработчиков событий
    function initEventListeners() {
      // Очистка поиска
      document.getElementById('search-clear').addEventListener('click', function() {
        document.getElementById('search').value = '';
        drawTiles();
      });
      
      // Переход к тайлу
      document.getElementById('goto-btn').addEventListener('click', function() {
        const tileId = document.getElementById('search').value.trim();
        if (!tileId) return;
        
        const tile = tileData.find(function(t) { return t.id_tile == tileId; });
        if (!tile) {
          log('Тайл #' + tileId + ' не найден', true);
          return;
        }
        
        map.flyTo([tile.lat, tile.lng], 7, {
          animate: true,
          duration: 1
        });
      });
      
      // Поиск при вводе
      document.getElementById('search').addEventListener('input', function() {
        drawTiles();
      });
      
      // Сброс фильтров
      document.getElementById('reset').addEventListener('click', function() {
        document.getElementById('search').value = '';
        document.getElementById('status-filter').value = '';
        drawGrid();
        drawTiles();
      });
      
      // Изменение фильтра
      document.getElementById('status-filter').addEventListener('change', function() {
        drawGrid();
        drawTiles();
      });
      
      // Снимок экрана
      document.getElementById('screenshot-btn').addEventListener('click', function() {
        html2canvas(document.getElementById('map')).then(function(canvas) {
          const link = document.createElement('a');
          link.href = canvas.toDataURL('image/png');
          link.download = 'map-' + new Date().toISOString().slice(0, 19) + '.png';
          link.click();
        });
      });
      
      // Сворачивание панели
      document.getElementById('toggle-panel').addEventListener('click', function() {
        const panel = document.getElementById('panel');
        panel.classList.toggle('collapsed');
        this.textContent = panel.classList.contains('collapsed') ? '🔼' : '🔽';
      });
      
      // Делегирование событий для попапов
      map.on('popupopen', function(e) {
        const popup = e.popup;
        popup.getElement().addEventListener('click', function(event) {
          if (event.target.classList.contains('mark-btn')) {
            const tileId = parseInt(event.target.dataset.id);
            const markType = event.target.dataset.type;
            saveMark(tileId, markType);
          }
          
          if (event.target.classList.contains('save-comment')) {
            const tileId = parseInt(event.target.dataset.id);
            const comment = document.getElementById('comment-' + tileId).value;
            saveMark(tileId, 'comment', comment);
          }
        });
      });
      
      // Делегирование событий для избранного
      document.getElementById('favorites-list').addEventListener('click', function(event) {
        if (!event.target.classList.contains('goto-fav') && 
            !event.target.classList.contains('remove-fav')) return;
            
        const tileId = parseInt(event.target.dataset.id);
        
        if (event.target.classList.contains('goto-fav')) {
          const tile = tileData.find(function(t) { return t.id_tile === tileId; });
          if (tile) {
            map.flyTo([tile.lat, tile.lng], 7, { animate: true, duration: 1 });
          }
        } else if (event.target.classList.contains('remove-fav')) {
          saveMark(tileId, 'clear');
        }
      });
      
      // Обновление при перемещении карты
      map.on('moveend', function() {
        drawGrid();
        drawTiles();
      });
      
      // Обновление при изменении зума
      map.on('zoomend', function() {
        drawTiles();
      });
    }

    // Инициализация приложения
    function initApp() {
      try {
        // Инициализация Telegram
        const user = initTelegram();
        
        // Инициализация карты
        initMap(user);
        
        // Логирование успешного запуска
        log('✅ Приложение успешно запущено');
        
      } catch (error) {
        log('⚠️ Критическая ошибка инициализации: ' + error.message, true);
        alert('Произошла критическая ошибка при запуске приложения');
      }
    }

    // Запуск приложения
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
