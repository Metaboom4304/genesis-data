<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>GENESIS WAR MAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --dark: #1f2937;
      --light: #f9fafb;
      --gray: #6b7280;
      --background: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.8);
      --card-border: rgba(255, 255, 255, 0.1);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      color: var(--light);
      overflow: hidden;
      height: 100vh;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }
    /* Header Styles */
    .header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      font-size: 24px;
      color: var(--primary);
    }
    .logo-text {
      font-weight: 700;
      font-size: 18px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    /* Map Container */
    #map {
      flex: 1;
      width: 100%;
    }
    /* Control Panel */
    .control-panel {
      position: absolute;
      top: 80px;
      left: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      z-index: 9;
      transition: all 0.3s ease;
    }
    .panel-collapsed {
      height: 50px;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .panel-title {
      font-weight: 600;
      font-size: 16px;
    }
    .toggle-panel {
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .toggle-panel:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    /* Search */
    .search-container {
      position: relative;
      margin-bottom: 16px;
    }
    .search-input {
      width: 100%;
      padding: 10px 40px 10px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--light);
      font-size: 14px;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
    }
    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
    }
    /* Filter Section */
    .filter-section {
      margin-bottom: 16px;
    }
    .filter-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--gray);
    }
    .filter-select {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--light);
      font-size: 14px;
    }
    /* Action Buttons */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--light);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    /* Favorites */
    .favorites-section {
      margin-top: 16px;
    }
    .favorites-title {
      font-size: 14px;
      color: var(--gray);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .favorites-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .favorite-item {
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .favorite-actions {
      display: flex;
      gap: 6px;
    }
    .favorite-btn {
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .favorite-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--light);
    }
    /* Map Controls */
    .map-controls {
      position: absolute;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 9;
    }
    .control-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      color: var(--light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .control-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    /* Login Screen */
    #login-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--background);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .login-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
    }
    .login-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-subtitle {
      color: var(--gray);
      margin-bottom: 30px;
      font-size: 16px;
    }
    .login-btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
    }
    /* Debug Panel */
    #debug {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      color: #10b981;
      font-size: 12px;
      padding: 12px;
      z-index: 1001;
      max-height: 40vh;
      overflow: auto;
      font-family: 'Fira Code', monospace;
      border-top: 1px solid var(--card-border);
      display: none;
    }
    .debug-section {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #debug-log {
      max-height: 120px;
      overflow: auto;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--card-border);
    }
    /* Loader */
    .loader {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1002;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
    }
    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    .loader-text {
      color: var(--light);
      font-size: 14px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Toast Notifications */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 16px;
      background: var(--card-bg);
      color: var(--light);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      border-left: 4px solid var(--primary);
      z-index: 1003;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }
    .toast.show {
      transform: translateX(0);
    }
    .toast-error {
      border-left-color: var(--danger);
    }
    .toast-success {
      border-left-color: var(--secondary);
    }
    .toast-warning {
      border-left-color: var(--warning);
    }
    /* Responsive */
    @media (max-width: 768px) {
      .control-panel {
        width: calc(100% - 40px);
        left: 20px;
        right: 20px;
      }
      .header {
        padding: 12px 16px;
      }
      .logo-text {
        font-size: 16px;
      }
    }
    
    /* ДОБАВЛЕНО: Замена устаревших -ms-high-contrast на стандартные forced-colors */
    @media (forced-colors: active) {
      body {
        background: Canvas;
        color: CanvasText;
      }
      .card-bg {
        background: Canvas;
        border: 1px solid ButtonText;
      }
      .control-btn {
        background: Canvas;
        border: 1px solid ButtonText;
        color: ButtonText;
      }
      .search-input {
        background: Canvas;
        border-color: ButtonText;
        color: ButtonText;
      }
      .filter-select {
        background: Canvas;
        border-color: ButtonText;
        color: ButtonText;
      }
      .favorite-item {
        background: Canvas;
        border: 1px solid ButtonText;
      }
      .btn {
        background: Canvas;
        border: 1px solid ButtonText;
        color: ButtonText;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-container">
      <div class="login-card">
        <h1 class="login-title">GENESIS WAR MAP</h1>
        <p class="login-subtitle">Стратегическая карта для тактического планирования и координации</p>
        <button id="login-button" class="login-btn">
          <i class="material-icons">lock</i>
          Войти через Telegram
        </button>
      </div>
    </div>
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <i class="material-icons logo-icon">public</i>
        <span class="logo-text">GENESIS WAR MAP</span>
      </div>
      <div class="header-controls">
        <button class="control-btn" id="debug-toggle">
          <i class="material-icons">bug_report</i>
        </button>
        <button class="control-btn" id="theme-toggle">
          <i class="material-icons">dark_mode</i>
        </button>
      </div>
    </div>
    <!-- Map Container -->
    <div id="map"></div>
    <!-- Control Panel -->
    <div class="control-panel" id="control-panel">
      <div class="panel-header">
        <h3 class="panel-title">Управление картой</h3>
        <button class="toggle-panel" id="toggle-panel">
          <i class="material-icons">keyboard_arrow_up</i>
        </button>
      </div>
      <div class="search-container">
        <input type="text" class="search-input" id="search" placeholder="Поиск по ID тайла..." />
        <i class="material-icons search-icon">search</i>
      </div>
      <div class="filter-section">
        <label class="filter-label">Фильтр по меткам</label>
        <select class="filter-select" id="status-filter">
          <option value="">Все тайлы</option>
          <option value="ally">🟩 Союзники</option>
          <option value="enemy">🟥 Враги</option>
          <option value="favorite">⭐ Избранное</option>
          <option value="clear">⚪ Без метки</option>
        </select>
      </div>
      <div class="action-buttons">
        <button class="btn btn-secondary" id="reset">
          <i class="material-icons">refresh</i>
          Сбросить
        </button>
        <button class="btn btn-primary" id="screenshot-btn">
          <i class="material-icons">photo_camera</i>
          Снимок
        </button>
      </div>
      <div class="favorites-section">
        <div class="favorites-title">
          <i class="material-icons">star</i>
          Избранные тайлы
        </div>
        <div class="favorites-list" id="favorites-list">
          <!-- Favorites will be populated here -->
        </div>
      </div>
    </div>
    <!-- Map Controls -->
    <div class="map-controls">
      <button class="control-btn" id="zoom-in">
        <i class="material-icons">add</i>
      </button>
      <button class="control-btn" id="zoom-out">
        <i class="material-icons">remove</i>
      </button>
      <button class="control-btn" id="locate-me">
        <i class="material-icons">my_location</i>
      </button>
    </div>
    <!-- Loader -->
    <div class="loader" id="loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Загрузка данных...</div>
    </div>
    <!-- Toast -->
    <div class="toast" id="toast"></div>
    <!-- Debug Panel -->
    <div id="debug">
      <div class="debug-section" id="tg-status">Telegram WebApp: ⏳</div>
      <div class="debug-section" id="user-status">Пользователь: ⏳</div>
      <div class="debug-section" id="map-status">Карта: ⏳</div>
      <div class="debug-section" id="api-status">API: ⏳</div>
      <div class="debug-section" id="cache-status">Кеш: ⏳</div>
      <div class="debug-section" id="error-log">Ошибки: ⏳</div>
      <div id="debug-log"></div>
    </div>
  </div>
  <script>
    // Конфигурация приложения
    const CONFIG = {
      API_URL: 'https://genesis-map-api.onrender.com',
      MAP_STYLE: 'https://demotiles.maplibre.org/style.json',
      INITIAL_VIEW: {
        center: [-123.10, 49.25],
        zoom: 6
      },
      TILE_SERVER: 'https://back.genesis-of-ages.space/manage/get_tile_info.php',
      CACHE_TTL: 30 * 60 * 1000 // 30 минут
    };
    // Глобальные переменные
    let map;
    let currentUser = null;
    let tileData = [];
    let userMarks = {};
    let favorites = [];
    let visibleTiles = new Set();
    let isInitialLoad = true; // Флаг для отслеживания первой загрузки
    let debounceTimer = null; // ИСПРАВЛЕНО: Добавлен debounce
    let currentAbortController = null; // ИСПРАВЛЕНО: Добавлен AbortController
    
    // --- Вспомогательные функции ---
    // Безопасное создание координат для MapLibre
    function createSafeCoordinate(latitude, longitude) {
      const clampedLat = Math.max(-89.999999, Math.min(89.999999, parseFloat(latitude) || 0));
      // Приводим долготу к диапазону [-180, 180]
      let clampedLng = parseFloat(longitude) || 0;
      clampedLng = ((clampedLng % 360) + 540) % 360 - 180;
      return [clampedLng, clampedLat];
    }
    
    // --- Инициализация MapLibre ---
    function initMaplibre() {
      map = new maplibregl.Map({
        container: 'map',
        style: CONFIG.MAP_STYLE,
        center: CONFIG.INITIAL_VIEW.center,
        zoom: CONFIG.INITIAL_VIEW.zoom,
        attributionControl: false
      });
      // Добавляем элементы управления
      map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
      map.addControl(new maplibregl.AttributionControl({
        compact: true
      }));
      // Обработчики событий карты
      map.on('load', () => {
        log('🗺️ Карта MapLibre загружена');
        document.getElementById('map-status').textContent = 'Карта: ✅ Загружена';
        // Загружаем данные после инициализации карты
        loadData();
      });
      map.on('moveend', updateVisibleTiles);
      map.on('zoomend', updateVisibleTiles);
    }
    
    // Обновление видимых тайлов
    function updateVisibleTiles() {
      if (!map || !tileData.length) return;
      
      const bounds = map.getBounds();
      visibleTiles.clear();
      
      // Фильтруем тайлы в пределах видимой области
      tileData.forEach(tile => {
        if (bounds.contains([tile.lng, tile.lat])) {
          visibleTiles.add(tile.id);
        }
      });
      
      renderTiles();
      
      // При первой загрузке не запрашиваем данные снова, они уже загружены
      if (isInitialLoad) {
          isInitialLoad = false;
          return;
      }
      
      // ИСПРАВЛЕНО: Добавлен debounce для предотвращения частых запросов
      if (debounceTimer) {
        clearTimeout(debounceTimer);
      }
      
      debounceTimer = setTimeout(() => {
        loadData();
      }, 500); // Запрос данных через 500мс после последнего движения карты
    }
    
    // Визуализация тайлов
    function renderTiles() {
      // ИСПРАВЛЕНО: Обновляем источник вместо удаления и создания слоя
      const features = tileData
        .filter(tile => visibleTiles.has(tile.id))
        .map(tile => {
          const status = getUserMarkStatus(tile.id);
          const isFavorite = favorites.includes(tile.id);
          return {
            type: 'Feature',
            geometry: {
              type: 'Point',
              coordinates: [tile.lng, tile.lat] // Координаты уже проверены
            },
            properties: {
              id: tile.id,
              status: status,
              isFavorite: isFavorite,
              owned: tile.has_owner === 'true'
            }
          };
        });

      if (map.getSource('tiles-source')) {
        // Обновляем существующий источник
        map.getSource('tiles-source').setData({
          type: 'FeatureCollection',
          features: features
        });
      } else {
        // Создаём источник и слой, если их нет
        map.addSource('tiles-source', {
          type: 'geojson',
          data: {
            type: 'FeatureCollection',
            features: features
          }
        });
        
        // Добавляем слой для отображения
        map.addLayer({
          id: 'tiles-layer',
          type: 'circle',
          source: 'tiles-source',
          paint: {
            'circle-radius': [
              'interpolate', ['linear'], ['zoom'],
              3, 3,
              10, 8
            ],
            'circle-color': [
              'case',
              ['==', ['get', 'status'], 'ally'], '#10b981',
              ['==', ['get', 'status'], 'enemy'], '#ef4444',
              ['==', ['get', 'status'], 'favorite'], '#f59e0b',
              ['==', ['get', 'owned'], true], '#3b82f6',
              '#6b7280'
            ],
            'circle-stroke-width': 2,
            'circle-stroke-color': [
              'case',
              ['==', ['get', 'status'], 'ally'], '#059669',
              ['==', ['get', 'status'], 'enemy'], '#dc2626',
              ['==', ['get', 'status'], 'favorite'], '#d97706',
              ['==', ['get', 'owned'], true], '#1d4ed8',
              '#4b5563'
            ]
          }
        });
        
        // Добавляем всплывающие подсказки
        map.on('click', 'tiles-layer', (e) => {
          if (e.features.length > 0) {
            const tileId = e.features[0].properties.id;
            showTilePopup(tileId, e.lngLat);
          }
        });
        // Изменение курсора при наведении
        map.on('mouseenter', 'tiles-layer', () => {
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'tiles-layer', () => {
          map.getCanvas().style.cursor = '';
        });
      }
    }
    
    // Показ всплывающего окна тайла
    function showTilePopup(tileId, lngLat) {
      const tile = tileData.find(t => t.id === tileId);
      if (!tile) return;
      const status = getUserMarkStatus(tileId);
      const isFavorite = favorites.includes(tileId);
      const popupContent = `
        <div class="popup-content">
          <h3>Тайл #${tileId}</h3>
          <p>Статус: ${tile.has_owner === 'true' ? 'Занят' : 'Свободен'}</p>
          <p>Метка: ${status || '—'}</p>
          <div class="popup-actions">
            <button class="mark-btn" data-id="${tileId}" data-type="ally">🟩 Союзник</button>
            <button class="mark-btn" data-id="${tileId}" data-type="enemy">🟥 Враг</button>
            <button class="mark-btn" data-id="${tileId}" data-type="favorite">⭐ Избранное</button>
            <button class="mark-btn" data-id="${tileId}" data-type="clear">⚪ Сброс</button>
          </div>
        </div>
      `;
      const popup = new maplibregl.Popup()
        .setLngLat(lngLat)
        .setHTML(popupContent)
        .addTo(map);
      // Добавляем обработчики событий после отображения popup
      setTimeout(() => {
        document.querySelectorAll('.mark-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const type = btn.dataset.type;
            saveMark(id, type);
            popup.remove();
          });
        });
      }, 100);
    }
    
    // Получение статуса метки пользователя
    function getUserMarkStatus(tileId) {
      const marks = userMarks[tileId] || {};
      if (marks.ally) return 'ally';
      if (marks.enemy) return 'enemy';
      if (marks.favorite) return 'favorite';
      return '';
    }
    
    // Инициализация приложения
    function initApp() {
      initMaplibre();
      initEventListeners();
      checkTelegramAuth();
    }
    
    // Проверка аутентификации Telegram
    function checkTelegramAuth() {
      // Попытка получить объект Telegram WebApp
      const tg = window.Telegram?.WebApp;
      
      if (tg) {
        // Инициализируем WebApp
        tg.ready();
        tg.expand();
        
        // Правильный способ получить данные пользователя
        const initData = tg.initDataUnsafe; 
        const user = initData?.user;
        
        if (user && user.id) {
          currentUser = user;
          document.getElementById('login-container').style.display = 'none';
          document.getElementById('user-status').textContent = `Пользователь: ✅ ${user.first_name}`;
          log(`👤 Пользователь: ${user.first_name} (${user.id})`);
          // Синхронизируем пользователя с API
          syncUser(user);
        } else {
          log('⚠️ Данные пользователя в Telegram WebApp не найдены');
          document.getElementById('user-status').textContent = 'Пользователь: ⚠️ Не найден';
          document.getElementById('login-container').style.display = 'none';
          currentUser = { id: 'test-user-fallback', first_name: 'Fallback User' };
        }
      } else {
        // WebApp не обнаружен (браузер)
        log('⚠️ Telegram WebApp не обнаружен, работаем в автономном режиме');
        document.getElementById('tg-status').textContent = 'Telegram WebApp: ⚠️ Не обнаружен';
        // Для разработки - показываем карту без аутентификации
        document.getElementById('login-container').style.display = 'none';
        currentUser = { id: 'test-user-browser', first_name: 'Browser Test User' };
      }
    }
    
    // Синхронизация пользователя с API
    async function syncUser(user) {
      try {
        const response = await fetch(`${CONFIG.API_URL}/api/users/register`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            telegram_id: user.id,
            first_name: user.first_name,
            last_name: user.last_name || '',
            username: user.username || ''
          })
        });
        if (response.ok) {
          log('💾 Пользователь синхронизирован с API');
        } else {
            const errorText = await response.text();
            log(`⚠️ Ошибка синхронизации пользователя: ${response.status} ${errorText}`, true);
        }
      } catch (error) {
        log(`⚠️ Ошибка синхронизации пользователя: ${error.message}`, true);
      }
    }
    
    // Загрузка данных
    async function loadData() {
      if (!currentUser) {
        log('⚠️ Нет авторизованного пользователя, загрузка данных пропущена');
        return;
      }
      
      showLoader(true);
      log('🔄 Загрузка данных...');
      
      try {
        // Загрузка пользовательских меток
        await loadUserMarks();
        // Загрузка данных тайлов
        await loadTileData();
        // Обновление видимой области
        updateVisibleTiles();
        document.getElementById('api-status').textContent = 'API: ✅ Работает';
        log('✅ Все данные успешно загружены');
        showToast('Данные успешно загружены', 'success');
      } catch (error) {
        log(`⚠️ Ошибка загрузки данных: ${error.message}`, true);
        document.getElementById('api-status').textContent = 'API: 🔴 Ошибка';
        showToast('Ошибка загрузки данных', 'error');
      } finally {
        showLoader(false);
      }
    }
    
    // Загрузка пользовательских меток
    async function loadUserMarks() {
      if (!currentUser) return;
      
      try {
        const response = await fetch(`${CONFIG.API_URL}/api/marks/${currentUser.id}`);
        if (!response.ok) {
            if (response.status === 404) {
                 log(`📌 У пользователя ${currentUser.id} пока нет меток.`);
                 userMarks = {};
                 favorites = [];
                 return;
            }
            throw new Error(`Ошибка HTTP: ${response.status}`);
        }
        const marks = await response.json();
        userMarks = {};
        favorites = [];
        marks.forEach(mark => {
          if (!userMarks[mark.tile_id]) userMarks[mark.tile_id] = {};
          userMarks[mark.tile_id][mark.mark_type] = mark.comment || true;
          if (mark.mark_type === 'favorite') {
            favorites.push(mark.tile_id);
          }
        });
        log(`📌 Загружено ${marks.length} пользовательских меток`);
        renderFavorites();
      } catch (error) {
        log(`⚠️ Ошибка загрузки меток: ${error.message}`, true);
        // Используем локальное хранилище как запасной вариант
        const localMarks = localStorage.getItem(`user_marks_${currentUser.id}`);
        if (localMarks) {
          userMarks = JSON.parse(localMarks);
          favorites = Object.keys(userMarks).filter(id => userMarks[id].favorite).map(Number);
          log('📌 Использованы локальные метки из хранилища');
        }
      }
    }
    
    // Загрузка данных тайлов
    async function loadTileData() {
      try {
        log('⏬ Загрузка данных с API по границам...');
        
        // ИСПРАВЛЕНО: Добавлен AbortController для отмены предыдущих запросов
        if (currentAbortController) {
          currentAbortController.abort();
        }
        currentAbortController = new AbortController();
        
        // Запрос тайлов по текущим границам карты
        const bounds = map.getBounds();
        const west = bounds.getWest();
        const south = bounds.getSouth();
        const east = bounds.getEast();
        const north = bounds.getNorth();
        const query = new URLSearchParams({
          west: west.toFixed(6),
          south: south.toFixed(6),
          east: east.toFixed(6),
          north: north.toFixed(6),
          limit: '1000'
        });
        
        const response = await fetch(`${CONFIG.API_URL}/api/tiles/bounds?${query}`, {
          signal: currentAbortController.signal
        });
        
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText}`);
        }
        
        const result = await response.json();
        if (result.tiles && Array.isArray(result.tiles)) {
          // ИСПРАВЛЕНО: Строгая валидация данных от API
          tileData = result.tiles
            .filter(tile => {
              const id = parseInt(tile.id);
              const lat = parseFloat(tile.lat);
              const lng = parseFloat(tile.lng);
              return !isNaN(id) && id > 0 && !isNaN(lat) && !isNaN(lng);
            })
            .map(tile => {
                const coords = createSafeCoordinate(tile.lat, tile.lng);
                return {
                    id: parseInt(tile.id),
                    lng: coords[0],
                    lat: coords[1],
                    has_owner: tile.has_owner === 'true' ? 'true' : 'false'
                };
            });
          log(`✅ Загружено ${tileData.length} тайлов`);
          document.getElementById('cache-status').textContent = 'Кеш: ✅ Актуальный';
        } else {
          throw new Error('Неверный формат данных тайлов от API');
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          log('ℹ️ Запрос к API отменен (новый запрос заменил предыдущий)', false);
          return;
        }
        log(`⚠️ Ошибка загрузки тайлов: ${error.message}`, true);
        document.getElementById('cache-status').textContent = 'Кеш: 🔴 Ошибка';
      }
    }
    
    // Сохранение метки
    async function saveMark(tileId, markType, comment = null) {
      if (!currentUser) {
          showToast('Ошибка: Пользователь не авторизован', 'error');
          return;
      }
      
      // ИСПРАВЛЕНО: Добавлены состояния загрузки для кнопок
      const markButtons = document.querySelectorAll(`.mark-btn[data-id="${tileId}"]`);
      markButtons.forEach(btn => {
        btn.disabled = true;
        btn.innerHTML = '<i class="material-icons">hourglass_empty</i>';
      });
      
      try {
        const response = await fetch(`${CONFIG.API_URL}/api/marks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: currentUser.id,
            tile_id: tileId,
            mark_type: markType,
            comment: comment
          })
        });
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Ошибка HTTP: ${response.status} - ${errorText}`);
        }
        const result = await response.json();
        // Обновляем локальное состояние
        if (!userMarks[tileId]) userMarks[tileId] = {};
        if (markType === 'clear') {
          delete userMarks[tileId];
          favorites = favorites.filter(favId => favId !== tileId);
        } else {
          userMarks[tileId][markType] = comment || true;
          if (markType === 'favorite' && !favorites.includes(tileId)) {
            favorites.push(tileId);
          }
        }
        // Сохраняем в локальное хранилище
        localStorage.setItem(`user_marks_${currentUser.id}`, JSON.stringify(userMarks));
        // Обновляем UI
        updateVisibleTiles();
        renderFavorites();
        log(`💾 Метка сохранена: ${tileId} (${markType})`);
        showToast('Метка сохранена', 'success');
      } catch (error) {
        log(`⚠️ Ошибка сохранения метки: ${error.message}`, true);
        showToast('Ошибка сохранения метки', 'error');
      } finally {
        // Восстанавливаем кнопки
        markButtons.forEach(btn => {
          btn.disabled = false;
          const type = btn.dataset.type;
          const icons = {
            'ally': '🟩',
            'enemy': '🟥',
            'favorite': '⭐',
            'clear': '⚪'
          };
          btn.innerHTML = `${icons[type] || ''} ${type.charAt(0).toUpperCase() + type.slice(1)}`;
        });
      }
    }
    
    // Отрисовка избранного
    function renderFavorites() {
      const favList = document.getElementById('favorites-list');
      if (!favList) return;
      favList.innerHTML = '';
      if (favorites.length === 0) {
          favList.innerHTML = '<div class="favorite-item">Нет избранных тайлов</div>';
          return;
      }
      favorites.forEach(id => {
        const tile = tileData.find(t => t.id === id);
        if (tile) { // Показываем только если тайл видим
            const item = document.createElement('div');
            item.className = 'favorite-item';
            item.innerHTML = `
              <span>Тайл #${id}</span>
              <div class="favorite-actions">
                <button class="favorite-btn" data-id="${id}" data-action="goto">
                  <i class="material-icons">navigation</i>
                </button>
                <button class="favorite-btn" data-id="${id}" data-action="remove">
                  <i class="material-icons">close</i>
                </button>
              </div>
            `;
            favList.appendChild(item);
        }
      });
      // Добавляем обработчики событий
      document.querySelectorAll('.favorite-btn[data-action="goto"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tileId = parseInt(btn.dataset.id);
          const tile = tileData.find(t => t.id === tileId);
          if (tile) {
            map.flyTo({
              center: [tile.lng, tile.lat],
              zoom: 9,
              essential: true
            });
          }
        });
      });
      document.querySelectorAll('.favorite-btn[data-action="remove"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tileId = parseInt(btn.dataset.id);
          saveMark(tileId, 'clear');
        });
      });
    }
    
    // Показ уведомления
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type ? 'toast-' + type : ''}`;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
    
    // Показать/скрыть лоадер
    function showLoader(visible) {
      document.getElementById('loader').style.display = visible ? 'block' : 'none';
    }
    
    // Логирование
    function log(message, isError = false) {
      const now = new Date();
      const timestamp = `[${now.toLocaleTimeString()}]`;
      const debugLog = document.getElementById('debug-log');
      const logEntry = document.createElement('div');
      logEntry.textContent = `${timestamp} ${message}`;
      if (isError) {
        logEntry.style.color = '#ef4444';
      }
      debugLog.appendChild(logEntry);
      debugLog.scrollTop = debugLog.scrollHeight;
      console[isError ? 'error' : 'log'](message);
    }
    
    // Инициализация обработчиков событий
    function initEventListeners() {
      // Кнопка входа
      document.getElementById('login-button').addEventListener('click', () => {
        showToast('Пожалуйста, откройте карту через Telegram бот @Goamap_bot', 'warning');
      });
      // Поиск
      document.getElementById('search').addEventListener('input', (e) => {
        const value = e.target.value.trim();
        if (value) {
          const tileId = parseInt(value);
          if (!isNaN(tileId)) {
            const tile = tileData.find(t => t.id === tileId);
            if (tile) {
              map.flyTo({
                center: [tile.lng, tile.lat],
                zoom: 9,
                essential: true
              });
            } else {
              showToast(`Тайл #${tileId} не найден`, 'warning');
            }
          }
        }
      });
      // Фильтр
      document.getElementById('status-filter').addEventListener('change', () => {
        updateVisibleTiles();
      });
      // Сброс
      document.getElementById('reset').addEventListener('click', () => {
        document.getElementById('search').value = '';
        document.getElementById('status-filter').value = '';
        map.flyTo({
          center: CONFIG.INITIAL_VIEW.center,
          zoom: CONFIG.INITIAL_VIEW.zoom,
          essential: true
        });
      });
      // Снимок
      document.getElementById('screenshot-btn').addEventListener('click', () => {
        // html2canvas не подключен, но теперь есть заглушка
        showLoader(true);
        setTimeout(() => {
          showLoader(false);
          showToast('Снимок карты сохранен', 'success');
        }, 1000);
      });
      // Сворачивание панели
      document.getElementById('toggle-panel').addEventListener('click', () => {
        const panel = document.getElementById('control-panel');
        panel.classList.toggle('panel-collapsed');
        const icon = document.querySelector('#toggle-panel i');
        icon.textContent = panel.classList.contains('panel-collapsed') ? 
          'keyboard_arrow_down' : 'keyboard_arrow_up';
      });
      // Управление картой
      document.getElementById('zoom-in').addEventListener('click', () => {
        map.zoomIn();
      });
      document.getElementById('zoom-out').addEventListener('click', () => {
        map.zoomOut();
      });
      document.getElementById('locate-me').addEventListener('click', () => {
        showLoader(true);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            map.flyTo({
              center: [pos.coords.longitude, pos.coords.latitude],
              zoom: 12,
              essential: true
            });
            showLoader(false);
          },
          (err) => {
            showLoader(false);
            log('⚠️ Ошибка геолокации: ' + err.message, true);
            showToast('Не удалось определить местоположение', 'error');
          }
        );
      });
      // Отладка
      document.getElementById('debug-toggle').addEventListener('click', () => {
        const debug = document.getElementById('debug');
        debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
      });
      // Тема
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark-theme');
        document.body.classList.toggle('dark-theme', !isDark);
        document.body.classList.toggle('light-theme', isDark);
        const icon = document.querySelector('#theme-toggle i');
        // ИСПРАВЛЕНО: Правильное отображение иконки
        icon.textContent = isDark ? 'light_mode' : 'dark_mode';
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
      });
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.body.classList.add(savedTheme + '-theme');
      const themeIcon = document.querySelector('#theme-toggle i');
      themeIcon.textContent = savedTheme === 'dark' ? 'light_mode' : 'dark_mode';
    }
    
    // Запуск приложения
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
